{% extends "base.html" %}
{% block title %}Добавить объект — MyReeltor{% endblock %}
{% block content %}<section class="form-page"><p class="eyebrow">НОВОЕ ОБЪЯВЛЕНИЕ</p><h1>Добавить объект</h1><div class="example-hint">Пример: Двухкомнатная на Ленина | 8200000 | ул. Ленина, 15 | Центральный | квартира | 2 | 54 | 5 | 9</div><form class="property-form" method="post" action="/add"><label>Название *<input required name="title" placeholder="Например: Двухкомнатная на Ленина, 54 м²"></label><div class="form-grid"><label>Цена, ₽<input type="text" name="price" placeholder="Например: 8200000"></label><label>Тип<select name="property_type"><option value="квартира">Квартира</option><option value="дом">Дом</option><option value="студия">Студия</option><option value="таунхаус">Таунхаус</option></select></label><label>Район<input name="district" placeholder="Например: Центральный"></label><label>Адрес<input name="address" placeholder="Например: ул. Ленина, 15"></label><label>Комнаты<input type="text" name="rooms" placeholder="Например: 2"></label><label>Площадь, м²<input type="text" name="area" placeholder="Например: 54"></label><label>Этаж<input type="text" name="floor" placeholder="Например: 5"></label><label>Этажей в доме<input type="text" name="floors_total" placeholder="Например: 9"></label></div><label>Описание<textarea name="description" rows="7" placeholder="Опишите квартиру..."></textarea></label><label>Телефон продавца<input name="seller_phone" type="tel" placeholder="Например: +7 999 123-45-67"></label><label>Telegram продавца<input name="seller_telegram" placeholder="Например: @username"></label><button class="button" type="submit">Добавить объект</button></form></section>{% endblock %}
