{% extends "base.html" %}
{% block title %}Добавить объект — MyReeltor{% endblock %}
{% block content %}<section class="form-page"><p class="eyebrow">НОВОЕ ОБЪЯВЛЕНИЕ</p><h1>Добавить объект</h1><form class="property-form" method="post" action="/add"><label>Название *<input required name="title"></label><div class="form-grid"><label>Цена, ₽<input type="number" name="price"></label><label>Тип<select name="property_type"><option value="квартира">Квартира</option><option value="дом">Дом</option><option value="студия">Студия</option><option value="участок">Участок</option><option value="коммерция">Коммерция</option></select></label><label>Район<input name="district"></label><label>Адрес<input name="address"></label><label>Комнаты<input type="number" name="rooms"></label><label>Площадь, м²<input type="number" name="area"></label><label>Этаж<input type="number" name="floor"></label><label>Этажей в доме<input type="number" name="floors_total"></label></div><label>Описание<textarea name="description" rows="7"></textarea></label><label>Telegram продавца<input name="seller_telegram" placeholder="@username"></label><button class="button" type="submit">Добавить объект</button></form></section>{% endblock %}
